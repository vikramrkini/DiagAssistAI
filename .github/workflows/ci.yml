name: CI

on:
  push:
  pull_request:

jobs:
  backend-and-eval:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      STORE_AUDIO: "false"
      JWT_SECRET: "ci-secret"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./apps/api[dev]

      - name: Run API tests
        run: |
          cd apps/api
          pytest

      - name: Run eval harness (demo mode)
        run: |
          python scripts/eval/run_eval.py

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: scripts/eval/report.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web deps
        run: |
          cd apps/web
          npm install

      - name: Build web
        run: |
          cd apps/web
          npm run build
